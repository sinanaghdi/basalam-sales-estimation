[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basalam-sales-estimation"
version = "0.1.0"
description = "Leakage-aware evaluation of explainable models for weekly product sales estimation in the BaSalam marketplace"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.3",
  "lightgbm>=4.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
real = ["pyarrow>=14.0"]
dev = ["pytest>=7.4", "pyarrow>=14.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
